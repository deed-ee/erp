[package]
name = "article-delivery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
async-nats = { version = "=0.53.0", default-features = false, features = ["jetstream", "ring"] }
futures-util = "=0.3.32"
mongodb = "=3.10.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "=1.23.1", features = ["serde"] }
