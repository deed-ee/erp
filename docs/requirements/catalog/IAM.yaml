- id: IAM-003
  title: Protect service and agent identity lifecycle
  description: Separate delegated and service grants and avoid retaining raw credentials in diagnostics.
  rationale: Background jobs are not privileged tenant administrators.
  type: non-functional
  domain: IAM
  capability: IAM.01
  industries:
