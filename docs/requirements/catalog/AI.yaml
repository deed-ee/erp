- id: AI-001
  title: Discover typed permitted actions
  description: Expose semantic action inputs, outputs, preconditions and permission requirements without granting
    rights.
  rationale: Human, external-system and agent clients need the same business meaning.
  type: functional
  domain: AI
  capability: AI.01
  industries:
  - professional-services
  - trade
  actors:
  - Agent operator and human approver
  priority: P1
  status: proposed
  dependencies:
  - IAM-002
  - INT-002
  milestone: M0
  acceptance:
  - Discover read but not register for a reader; direct invocation of register is denied; validate structured errors
    and correlation against the same business contract without an LLM.
  - A scoped user can discover a supported read from the global input and reach the same fact from the owning
    workspace. A user without the read grant receives neither the suggestion nor result. Interpret supported
    English and German lookup filters without a provider; do not infer any stock fact from an Article record.
  - When several articles share an exact name, return bounded candidates under the same grant, expose the
    applied name filter, and ask the user to choose by SKU. Do not silently pick one or disclose other scopes.
  scenarios:
  - SC-05
  - SC-06
  decisions:
  - docs/adr/0003-semantic-contracts.md
  refines:
  - BD-013
  issues:
  - 19
  - 44
  - 85
  prs: []
  contracts:
  - contracts/openapi/master-data-v1.yaml
  - contracts/entities/article-v1.json
  - contracts/schemas/article-name-matches-v1.json
  tests:
  - tests/integration/smoke.py
  - ui/tests/command.spec.ts
  evidence: []
  questions:
  - How should a client refresh stale discovery?
  revision: 3
