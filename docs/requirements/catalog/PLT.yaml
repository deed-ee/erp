- id: PLT-002
  title: Make deployment and migrations reproducible
  description: Rebuild the supported local environment from reviewed versions and a known checkpoint.
  rationale: Operators need a predictable failure path during upgrades.
  type: non-functional
  domain: PLT
  capability: PLT.01
  industries:
  - trade
  actors:
  - Operator
  priority: P1
  status: proposed
  dependencies:
  - PLT-001
  milestone: M0
  acceptance:
  - Install twice from the same revisions; contracts match. Interrupt a migration on disposable data; recover without
    duplicate effects and record compatibility limits.
  - 'Interrupt during readiness transition: an unready instance receives no new work; old and new supported readers
    consume the additive shape. If rolling upgrade is unsupported, the runbook names the required maintenance window.'
  scenarios:
  - SC-05
  decisions:
  - docs/adr/0001-independent-services.md
  refines:
  - BD-020
  issues:
  - 18
  prs:
  - 37
  contracts: []
  tests: []
  evidence: []
  questions:
  - Which changes need downtime?
  revision: 1
- id: PLT-003
  title: Measure resource and latency baselines
  description: Record the workload and measurement envelope before making performance promises.
  rationale: An unqualified latency number cannot guide a small installation.
  type: non-functional
  domain: PLT
  capability: PLT.01
  industries:
  - trade
  actors:
  - Operator
  priority: P2
  status: proposed
  dependencies: []
  milestone: M0
  acceptance:
  - Run 100 synthetic reads and 100 registrations at concurrency 1 and 8; report p50/p95, failures, CPU, peak memory,
    dataset and hardware; emit no bearer or payload in telemetry.
  - Include timeouts in the error count and report latency of successful requests separately; verify that one correlation
    ID connects a failed synthetic request to redacted diagnostics.
  scenarios:
  - SC-05
  decisions:
  - docs/adr/0001-independent-services.md
  refines:
  - BD-024
  issues:
  - 18
  - 60
  prs: []
  contracts: []
  tests: []
  evidence: []
  questions:
  - What SLO follows from the first measurements?
  revision: 1
- id: PLT-004
  title: Port business data to a fresh installation
  description: Export authorized versioned data and document references in open formats with enough metadata for
    re-import.
  rationale: Self-hosting must include a practical exit path.
  type: functional
  domain: PLT
  capability: PLT.01
  industries:
  - international-group
  - trade
  actors:
  - Operator
  priority: P1
  status: proposed
  dependencies:
  - ORG-001
  milestone: M1
  acceptance:
  - Export an allowed organization, validate counts and checksums on import; omitted restricted records leak neither
    IDs nor counts; a second import reports duplicates without extra records.
  - For an archived document with a retention hold, an authorized export includes version, bytes and checksum; a
    deletion request cannot remove the held version. Releasing a hold must be an independently authorized action.
  scenarios:
  - SC-05
  - SC-08
  decisions:
  - docs/adr/0001-independent-services.md
  refines:
  - BD-004
  issues:
  - 18
  prs: []
  contracts: []
  tests: []
  evidence: []
  questions:
  - What retention rules survive migration?
  revision: 1
