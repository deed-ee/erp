- id: MDM-001
  title: Register and retrieve an article in the local slice
  description: Retain a scoped article across service restart in the synthetic demo.
  rationale: An executable slice grounds later contract discussions.
  type: functional
  domain: MDM
  capability: MDM.01
  industries:
  - trade
  actors:
  - Data steward
  priority: P0
  status: implemented
  dependencies: []
  milestone: M0
  acceptance:
  - Register SKU A; repeat in the same fixed scope and receive conflict; restart the service and retrieve the unchanged
    ID, name and revision. A malformed SKU is rejected.
  - An unauthenticated read or register returns 401 in the fixed-scope demo; this test makes no claim about real
    tenant isolation.
  scenarios:
  - SC-05
  decisions:
  - docs/adr/0001-independent-services.md
  refines:
  - BD-018
  issues:
  - 36
  - 40
  prs: []
  contracts:
  - contracts/openapi/master-data-v1.yaml
  - contracts/entities/article-v1.json
  tests:
  - tests/integration/smoke.py
  - tests/contracts/check.py
  evidence:
  - https://github.com/erp4us-org/erp4us/actions/runs/45234126484
  questions:
  - When should article updates enter the API?
  revision: 1
