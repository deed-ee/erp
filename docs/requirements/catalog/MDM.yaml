- id: MDM-003
  title: Detect a stale edit
  description: Apply a change only against the expected record revision.
  rationale: A second steward must not overwrite a correction unknowingly.
  type: functional
  domain: MDM
  capability: MDM.01
  industries:
  - engineering
  - international-group
  actors:
  - Data steward
  priority: P1
  status: proposed
  dependencies:
  - MDM-001
  milestone: M1
  acceptance:
  - Two authorized editors read revision 4. After one commits revision 5, the stale write fails without changing
    revision 5; the editor can reload.
  scenarios:
  - SC-01
  - SC-08
  decisions:
  - docs/adr/0001-independent-services.md
  refines:
  - BD-004
  issues:
  - 40
  - 63
  prs: []
  contracts: []
  tests: []
  evidence: []
  questions:
  - Which fields permit deliberate merges?
  revision: 1
