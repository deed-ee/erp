- id: INT-003
  title: Retry a command without duplicating its effect
  description: Bind command identity to caller scope, operation and normalized inputs.
  rationale: A timed-out write must be safely distinguishable from a new order.
  type: functional
  domain: INT
  capability: INT.01
  industries:
  - software
  - trade
  actors:
  - Integration operator
  priority: P1
  status: proposed
  dependencies:
  - ORG-001
  milestone: M1
  acceptance:
  - 'Retry with the same key and input: return the first outcome; same key and different input is rejected; another
    tenant cannot retrieve the first response.'
