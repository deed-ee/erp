- id: ORG-003
  title: Share only nominated master records
  description: In SC-08, keep one Article identity and explicitly grant each participating company access to it.
  rationale: A blank organization selector must never mean global read access.
  type: functional
  domain: ORG
  capability: ORG.01
  industries:
  - international-group
  actors:
  - Company administrator
  priority: P1
  status: approved
  reviewedOn: '2026-11-23'
  disposition: Maintainer selected shared identity with explicit company grants for the first Demo Global case (#54), rather than separate mapped copies.
  dependencies:
  - ORG-001
  - ORG-002
  milestone: M1
  acceptance:
  - Grant A and B access to G1. B changes its local description; both still refer to G1, A's description is unchanged and a confirmed order retains its original wording.
  - A's negotiated purchase price remains a local commercial fact. Sharing G1 does not expose that price to B, including in exports.
  - Company C has no grant. G1 is absent from its lookup, search counts and export even though C is in the same tenant.
  scenarios:
  - SC-08
  decisions:
  - docs/adr/0001-independent-services.md
  refines:
  - BD-003
  issues:
  - 39
  - 54
  prs: []
  contracts: []
  tests: []
  evidence: []
  questions:
  - What takes precedence if an override expires?
  revision: 2
