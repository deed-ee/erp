services:
  mongo:
    image: mongo:8.0.38@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
    entrypoint: ["/bin/sh", "/opt/erp4us/start-mongo.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev_mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${DEV_MONGO_ROOT_PASSWORD:?Run sh scripts/init-dev.sh first}
      DEV_MASTER_DATA_PASSWORD: ${DEV_MASTER_DATA_PASSWORD:?Run sh scripts/init-dev.sh first}
    volumes:
      - mongo-data:/data/db
      - ./infrastructure/compose/init-master-data.sh:/docker-entrypoint-initdb.d/init-master-data.sh:ro
      - ./infrastructure/compose/start-mongo.sh:/opt/erp4us/start-mongo.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const h = db.hello(); quit(h.setName === 'erp4us' && h.isWritablePrimary ? 0 : 1)", "mongodb://mongo:27017/admin?directConnection=true"]
      interval: 3s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8.0.38@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
    entrypoint: ["/bin/sh", "/opt/erp4us/init-replica-set.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev_mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${DEV_MONGO_ROOT_PASSWORD:?Run sh scripts/init-dev.sh first}
    volumes:
      - ./infrastructure/compose/init-replica-set.sh:/opt/erp4us/init-replica-set.sh:ro
    depends_on:
      mongo:
        condition: service_started
  master-data:
    build:
      context: .
      dockerfile: services/master-data/Dockerfile
    environment:
      ERP4US_MODE: local-demo
      ERP4US_BIND: 0.0.0.0:8080
      ERP4US_DEMO_TOKEN: ${ERP4US_DEMO_TOKEN:?Run sh scripts/init-dev.sh first}
      MASTER_DATA_MONGODB_URI: mongodb://master_data_app:${DEV_MASTER_DATA_PASSWORD:?Run sh scripts/init-dev.sh first}@mongo:27017/master_data?replicaSet=erp4us&serverSelectionTimeoutMS=3000&connectTimeoutMS=3000
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ERP4US_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  mongo-data:
