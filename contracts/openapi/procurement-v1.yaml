openapi: 3.1.0
info:
  title: erp4us Procurement drafts
  version: 1.0.0
  description: Read shortage proposals, save non-binding terms and record configured budget approval stages. This API does not issue purchase orders, commit spend, contact suppliers, reserve budget balances or receive goods.
security:
  - AccessToken: []
paths:
  /v1/procurement/proposals/by-plan/{plan_id}:
    get:
      operationId: getDraftProposalByPlan
      description: >
        Requires procurement.proposal.read for the verified tenant and organization.
        A draft appears asynchronously after Inventory publishes a material plan with positive buy shortages.
        No draft is created for plans with no buy shortages.
      parameters:
        - in: header
          name: X-Erp4us-Tenant
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Erp4us-Organization
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: plan_id
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Persisted draft in the authorized scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '400': { description: Invalid scope selectors or plan reference }
        '401':
          description: Missing or invalid bearer token
          headers:
            WWW-Authenticate:
              schema: { type: string, const: Bearer }
        '403': { description: Missing proposal read grant for the requested scope }
        '404': { description: No proposal for that plan in the authorized scope }
        '503': { description: Procurement storage unavailable }
  /v1/procurement/proposals/by-plan/{plan_id}/terms:
    parameters:
      - in: header
        name: X-Erp4us-Tenant
        required: true
        schema: { type: string, format: uuid }
      - in: header
        name: X-Erp4us-Organization
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: plan_id
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      operationId: getDraftPurchaseTermsByPlan
      description: >
        Requires procurement.proposal.read for the verified tenant and organization.
        Returns the latest saved terms, not live partner data. A proposal without
        saved terms has no revision to retrieve; use expected_revision 0 for the first save.
      responses:
        '200':
          description: Latest saved terms for the authorized scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseTerms' }
        '400': { description: Invalid scope selectors or plan reference }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing proposal read grant for the requested scope }
        '404': { description: No saved terms for that plan in the authorized scope }
        '503': { description: Procurement storage unavailable }
    post:
      operationId: saveDraftPurchaseTermsByPlan
      description: >
        Requires procurement.proposal.terms.write and master-data.partner.read in the
        verified tenant and organization. Master Data authorizes new partner reads
        using the same actor and scope. Each immutable positive shortage row must
        be included exactly once with its exact SKU and revision, including explicit
        null for an unrevisioned row. Procurement uses the original quantities and units,
        snapshots scoped partners with the supplier role, and computes exact EUR totals.
        This saves the entire set of terms as a new revision, starting at 1, without
        modifying the proposal or its draft status. No approval, supplier communication,
        order, receipt, or spend results. Command IDs are scoped to tenant, organization
        and plan. An authorized retry with the same command ID, expected revision and
        terms returns the original saved revision without consulting Master Data; input
        order is not significant. Retry a 503 with the same command if its outcome is
        unknown. A new edit must use a new command ID and the current terms revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePurchaseTerms' }
      responses:
        '200':
          description: Original saved terms for an identical command retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseTerms' }
        '201':
          description: New terms revision saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseTerms' }
        '400':
          description: Invalid scope, plan reference, malformed or oversized JSON command, exact row set, price or supplier (missing, outside the authorized scope or not a supplier)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing required scoped grant in Procurement or Master Data }
        '404': { description: No proposal for that plan in the authorized scope }
        '409': { description: 'Stale or exhausted terms revision, or changed intent under an already saved command ID' }
        '503': { description: 'Procurement storage or supplier verification unavailable, or write outcome uncertain' }
  /v1/procurement/proposals/by-plan/{plan_id}/approval:
    parameters:
      - in: header
        name: X-Erp4us-Tenant
        required: true
        schema: { type: string, format: uuid }
      - in: header
        name: X-Erp4us-Organization
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: plan_id
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      operationId: getDraftBudgetApproval
      description: >
        Requires procurement.proposal.read. Reports required stages and decisions for the exact current terms
        and configured policy. Old decisions never count toward revised terms or policy. A completed approval
        does not place a purchase order or reserve a budget balance. The policy is not editable here.
      responses:
        '200': { $ref: '#/components/responses/BudgetApproval' }
        '400': { description: Invalid scope selectors or plan reference }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing scoped read grant }
        '404': { description: No saved proposal terms for the plan in the authorized scope }
        '503': { description: No applicable policy or approval storage is unavailable }
    post:
      operationId: recordBudgetApprovalStage
      description: >
        Requires the proposal read grant and the exact procurement.approval.<stage_key> grant in the
        verified scope. Records a positive approval of the next required stage only. The verified terms
        editor cannot approve; the configured policy may also require different actors among stages.
        The caller names the reviewed versions but cannot supply amounts, approvers, grants or stage thresholds.
        Approval after all stages is distinct from explicitly issuing a purchase order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveBudgetStage' }
      responses:
        '201': { $ref: '#/components/responses/BudgetApproval' }
        '200':
          description: Original stage result on an authorized identical command retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetApproval' }
        '400': { description: Malformed scope selectors or command }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing grant or actor is not permitted by the separation rule }
        '404': { description: No saved proposal terms in the authorized scope }
        '409':
          description: 'Reviewed terms or policy changed, stage is not the next eligible stage, or command ID was used with different intent'
        '503': { description: 'No applicable policy, storage unavailable, or write outcome uncertain' }
components:
  securitySchemes:
    AccessToken: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          required: true
          schema: { type: string, const: Bearer }
    BudgetApproval:
      description: Versioned result of the scoped budget approval
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BudgetApproval' }
  schemas:
    Id:
      type: string
      format: uuid
      not: { const: '00000000-0000-0000-0000-000000000000' }
    Sku: { type: string, pattern: '^[A-Z0-9-]{1,64}(?![\s\S])' }
    Revision: { type: string, pattern: '^[A-Za-z0-9._-]{1,32}(?![\s\S])' }
    OptionalRevision:
      oneOf:
        - { $ref: '#/components/schemas/Revision' }
        - { type: 'null' }
    Pieces: { type: string, pattern: '^(?:[1-9][0-9]{0,5}|1000000)(?![\s\S])' }
    Proposal:
      type: object
      required: [proposal_id, plan_id, order_id, line_id, status, bom, lines]
      properties:
        proposal_id: { $ref: '#/components/schemas/Id' }
        plan_id: { $ref: '#/components/schemas/Id' }
        order_id: { $ref: '#/components/schemas/Id' }
        line_id: { $ref: '#/components/schemas/Id' }
        status: { type: string, const: draft }
        bom:
          type: object
          required: [sku, revision]
          properties:
            sku: { $ref: '#/components/schemas/Sku' }
            revision: { $ref: '#/components/schemas/Revision' }
        lines:
          type: array
          minItems: 1
          maxItems: 32
          description: Unique per SKU and revision, sorted by SKU then revision (null first).
          items:
            type: object
            required: [sku, revision, unit, pieces]
            properties:
              sku: { $ref: '#/components/schemas/Sku' }
              revision:
                oneOf:
                  - { $ref: '#/components/schemas/Revision' }
                  - { type: 'null' }
              unit: { type: string, const: EA }
              pieces: { $ref: '#/components/schemas/Pieces' }
    CanonicalId:
      allOf:
        - { $ref: '#/components/schemas/Id' }
        - { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])' }
    UnitPrice:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,6})\.[0-9]{2}(?![\s\S])'
      description: Canonical exact EUR decimal, from 0.00 to 9999999.99. No rounding, sign, whitespace or leading zeroes.
    Amount:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,14})\.[0-9]{2}(?![\s\S])'
      description: Exact computed EUR decimal, with two fractional places.
    SavePurchaseTerms:
      type: object
      additionalProperties: false
      required: [command_id, expected_revision, lines]
      properties:
        command_id: { $ref: '#/components/schemas/CanonicalId' }
        expected_revision: { type: integer, minimum: 0, maximum: 2147483647 }
        lines:
          type: array
          minItems: 1
          maxItems: 32
          description: Complete set of immutable shortage row keys, unique by the pair of SKU and revision.
          items:
            type: object
            additionalProperties: false
            required: [sku, revision, supplier_id, unit_price]
            properties:
              sku: { $ref: '#/components/schemas/Sku' }
              revision: { $ref: '#/components/schemas/OptionalRevision' }
              supplier_id: { $ref: '#/components/schemas/CanonicalId' }
              unit_price: { $ref: '#/components/schemas/UnitPrice' }
    PurchaseTerms:
      type: object
      additionalProperties: false
      required: [proposal_id, plan_id, status, revision, currency, lines, total]
      properties:
        proposal_id: { $ref: '#/components/schemas/Id' }
        plan_id: { $ref: '#/components/schemas/Id' }
        status: { type: string, const: draft }
        revision: { type: integer, minimum: 1, maximum: 2147483647 }
        currency: { type: string, const: EUR }
        lines:
          type: array
          minItems: 1
          maxItems: 32
          description: Sorted by SKU, then revision (null first). Quantities and units are unchanged from the proposal.
          items:
            type: object
            additionalProperties: false
            required: [sku, revision, unit, pieces, supplier, unit_price, line_total]
            properties:
              sku: { $ref: '#/components/schemas/Sku' }
              revision: { $ref: '#/components/schemas/OptionalRevision' }
              unit: { type: string, const: EA }
              pieces: { $ref: '#/components/schemas/Pieces' }
              supplier:
                type: object
                additionalProperties: false
                required: [id, code, name]
                properties:
                  id: { $ref: '#/components/schemas/Id' }
                  code: { type: string, pattern: '^[A-Z0-9-]{1,32}(?![\s\S])' }
                  name: { type: string, minLength: 1, maxLength: 120 }
              unit_price: { $ref: '#/components/schemas/UnitPrice' }
              line_total: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
    ApprovalStageKey: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}(?![\s\S])' }
    PositiveRevision: { type: integer, minimum: 1, maximum: 2147483647 }
    ApproveBudgetStage:
      type: object
      additionalProperties: false
      required: [command_id, terms_revision, policy_id, policy_revision, stage_key]
      properties:
        command_id: { $ref: '#/components/schemas/CanonicalId' }
        terms_revision: { $ref: '#/components/schemas/PositiveRevision' }
        policy_id: { $ref: '#/components/schemas/CanonicalId' }
        policy_revision: { $ref: '#/components/schemas/PositiveRevision' }
        stage_key: { $ref: '#/components/schemas/ApprovalStageKey' }
    BudgetApproval:
      type: object
      additionalProperties: false
      required: [proposal_id, plan_id, terms_revision, policy_id, policy_revision, currency, total, state, stages]
      properties:
        proposal_id: { $ref: '#/components/schemas/Id' }
        plan_id: { $ref: '#/components/schemas/Id' }
        terms_revision: { $ref: '#/components/schemas/PositiveRevision' }
        policy_id: { $ref: '#/components/schemas/Id' }
        policy_revision: { $ref: '#/components/schemas/PositiveRevision' }
        currency: { type: string, const: EUR }
        total: { $ref: '#/components/schemas/Amount' }
        state: { type: string, enum: [pending, approved] }
        stages:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [key, state]
            properties:
              key: { $ref: '#/components/schemas/ApprovalStageKey' }
              state: { type: string, enum: [pending, approved] }
