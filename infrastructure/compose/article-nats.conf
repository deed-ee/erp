port: 4222
max_payload: 8192
jetstream {
  store_dir: "/data"
  max_file_store: 64MB
}
authorization {
  users: [
    {user: "provisioner", password: $DEV_NATS_ADMIN_PASSWORD},
    {user: "article_relay", password: $DEV_NATS_RELAY_PASSWORD, permissions: {
      publish: ["business.master-data.article.registered.v1"],
      subscribe: ["_INBOX.>"]
    }},
    {user: "article_replay", password: $DEV_NATS_REPLAY_PASSWORD, permissions: {
      publish: ["$JS.API.STREAM.MSG.GET.ARTICLES",
                "business.master-data.article.registered.v1"],
      subscribe: ["_INBOX.>"]
    }},
    {user: "article_receipts", password: $DEV_NATS_RECEIPTS_PASSWORD, permissions: {
      publish: ["$JS.API.CONSUMER.INFO.ARTICLES.article-receipts",
                "$JS.API.CONSUMER.MSG.NEXT.ARTICLES.article-receipts",
                "$JS.ACK.ARTICLES.article-receipts.>"],
      subscribe: ["_INBOX.>"]
    }}
  ]
}
