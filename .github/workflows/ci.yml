name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: '3.12' }
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python tests/contracts/check.py
      - name: Validate requirements, traceability and publication index
        run: |
          python tests/requirements/check.py
          python -m unittest discover -s tests/requirements
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: |
          sh scripts/init-dev.sh
          while IFS='=' read -r name value; do
            printf '::add-mask::%s\n' "$value"
          done < .env
      - run: docker compose config --quiet && docker compose up --build -d
      - run: python3 tests/integration/smoke.py --restart --outbox --restore
      - name: Scan the built service image
        run: |
          sh scripts/install-dependency-scanner.sh trivy "$RUNNER_TEMP/tools"
          image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q master-data)")
          "$RUNNER_TEMP/tools/trivy" image --image-src docker --scanners vuln --severity HIGH,CRITICAL \
            --format json --output "$RUNNER_TEMP/trivy.json" "$image"
          "$RUNNER_TEMP/tools/trivy" convert --format table "$RUNNER_TEMP/trivy.json"
          jq -e '[.Results[].Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length == 0' "$RUNNER_TEMP/trivy.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: ui/.nvmrc, cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build and exercise the Article workspace
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        run: docker compose logs --no-color --tail=80
      - if: always()
        run: if [ -f .env ]; then docker compose down -v; fi
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: cargo install cargo-audit --version 0.23.0 --locked --no-default-features
      - run: cargo audit
      - name: Check resolved crate licenses, sources and bans
        run: |
          sh scripts/install-dependency-scanner.sh cargo-deny "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/cargo-deny" --locked --workspace --all-features check licenses sources bans
