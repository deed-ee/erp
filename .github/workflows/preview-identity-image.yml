name: Preview identity image advisories
on:
  pull_request:
    paths:
      - 'compose.preview-identity.yaml'
      - 'infrastructure/preview-identity/**'
      - '.github/workflows/preview-identity-image.yml'
      - 'scripts/install-dependency-scanner.sh'
      - 'scripts/scan-preview-identity.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-identity-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and scan the loopback identity image, including Java libraries
        run: |
          docker compose -f compose.preview-identity.yaml build preview-identity
          image=$(docker compose -f compose.preview-identity.yaml config --images)
          sh scripts/scan-preview-identity.sh "$image" "$RUNNER_TEMP/preview-identity-advisories"
